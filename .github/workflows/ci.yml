name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  ai-core:
    name: AI Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-core/requirements-dev.txt

      - run: pip install -r ai-core/requirements-dev.txt

      - name: Run unit tests
        working-directory: ai-core
        # Integration tests are excluded by pytest.ini's default addopts; they need live
        # Pinecone credentials and a seeded index.
        run: pytest

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx tsc --noEmit
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend
